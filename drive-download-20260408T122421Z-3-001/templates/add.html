{% extends "base.html" %}

{% block title %}Add Movie - {{ config.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Add New Movie</h1>
    <p>Add a new movie to the database</p>
</div>

<div class="form-container">
    <form method="POST" action="/admin/add" class="admin-form">
        <div class="form-section">
            <h3>Basic Information</h3>
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" required
                       placeholder="Enter movie title">
            </div>

            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" name="description" required rows="4"
                          placeholder="Enter movie description/synopsis"></textarea>
            </div>

            <div class="form-group">
                <label for="genre">Genre *</label>
                <input type="text" id="genre" name="genre" required
                       placeholder="e.g., Drama, Action, Comedy">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="release_date">Release Date *</label>
                    <input type="date" id="release_date" name="release_date" required>
                </div>

                <div class="form-group">
                    <label for="runtime">Runtime (minutes) *</label>
                    <input type="number" id="runtime" name="runtime" required min="1"
                           placeholder="e.g., 120">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="rating">Rating (0-10) *</label>
                    <input type="number" id="rating" name="rating" required min="0" max="10" step="0.1"
                           placeholder="e.g., 8.5">
                </div>

                <div class="form-group">
                    <label for="age_rating">Age Rating *</label>
                    <select id="age_rating" name="age_rating" required>
                        <option value="G">G (General Audiences)</option>
                        <option value="PG">PG (Parental Guidance)</option>
                        <option value="PG-13" selected>PG-13 (Parents Strongly Cautioned)</option>
                        <option value="R">R (Restricted)</option>
                        <option value="NC-17">NC-17 (Adults Only)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3>Credits</h3>
            <div class="form-group">
                <label for="director">Director</label>
                <input type="text" id="director" name="director"
                       placeholder="e.g., Christopher Nolan">
            </div>

            <div class="form-group">
                <label for="cast">Cast</label>
                <textarea id="cast" name="cast" rows="3"
                          placeholder="e.g., Leonardo DiCaprio, Joseph Gordon-Levitt, Ellen Page"></textarea>
            </div>
        </div>

        <div class="form-section">
            <h3>Media & Language</h3>
            <div class="form-group">
                <label for="poster_url">Poster URL</label>
                <input type="url" id="poster_url" name="poster_url"
                       placeholder="https://example.com/poster.jpg">
            </div>

            <div class="form-group">
                <label for="trailer_url">Trailer URL (YouTube embed)</label>
                <input type="url" id="trailer_url" name="trailer_url"
                       placeholder="https://www.youtube.com/embed/VIDEO_ID">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="language">Language</label>
                    <input type="text" id="language" name="language"
                           placeholder="e.g., English" value="English">
                </div>

                <div class="form-group">
                    <label for="subtitle">Subtitles</label>
                    <input type="text" id="subtitle" name="subtitle"
                           placeholder="e.g., English, Spanish" value="English">
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Movie</button>
            <a href="/browse" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
